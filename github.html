<!-- SCRIPT LIVE DE L'HORLOGE -->
<script>
    function updateXPClock() {
        const now = new Date();
        let hours = now.getHours();
        let minutes = now.getMinutes();
        hours = hours < 10 ? '0' + hours : hours;
        minutes = minutes < 10 ? '0' + minutes : minutes;
        document.getElementById('xp-clock').textContent = hours + ':' + minutes;
    }
    setInterval(updateXPClock, 1000);
    updateXPClock();
</script>
